<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#14AB98">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ .Site.Params.description }}">
  <meta name="robots" content="noindex">
  <title>Page Not Found &middot; {{ .Site.Title }}</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="{{ .Site.Title }}">
  <link rel="icon" sizes="192x192" href="{{ .Site.BaseURL }}images/touch/chrome-touch-icon-192x192.png">
  <link rel="apple-touch-icon" href="{{ .Site.BaseURL }}images/touch/apple-touch-icon.png">

  <link rel="author" href="https://linkedin.com/in/marsavela">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700|Catamaran:400,800&display=swap">

  {{ $style := resources.Get "404.scss" | css.Sass | resources.Fingerprint }}
  <link rel="stylesheet" href="{{ $style.Permalink }}">
</head>

<body>
  <h1>Page Not Found</h1>
  <section class="error-container">
    <span>4</span>
    <span><span class="screen-reader-text">0</span></span>
    <span>4</span>
  </section>
  <div class="link-container">
    <a href="{{ .Site.BaseURL }}" class="more-link">Back to homepage</a>
  </div>
</body>

</html>
